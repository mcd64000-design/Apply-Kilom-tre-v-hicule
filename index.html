<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Kilométrique</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; }
        .tab-btn.active { background: #0070f3; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<div class="box">
    <div class="tabs">
        <button class="tab-btn active" onclick="showPage('form', this)">Nouveau</button>
        <button class="tab-btn" onclick="showPage('hist', this)">Historique</button>
    </div>

    <div id="form" class="page active">
        <input type="text" id="nom" placeholder="Nom">
        <input type="text" id="prenom" placeholder="Prénom">
        <input type="date" id="date_trajet">
        <input type="text" id="dest" placeholder="Destination">
        <input type="number" id="km_dep" placeholder="KM Départ">
        <input type="number" id="km_arr" placeholder="KM Arrivée">
        <input type="range" id="jauge" min="1" max="8" value="4">
        <select id="propre"><option value="Oui">Oui</option><option value="Non">Non</option></select>
        <button onclick="envoyerTrajet()">Enregistrer le trajet</button>
        <p id="msg"></p>
    </div>

    <div id="hist" class="page">
        <div id="liste">Chargement...</div>
    </div>
</div>

<script>
    const sbUrl = "https://pckketidnitktkmqscik.supabase.co"; 
    const sbKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja2tldGlkbml0a3RrbXFzY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTc2MzYsImV4cCI6MjA5OTE3MzYzNn0.bwkJDCeD6iZAQCACEYLS9-UK9CwK0LMcKRAQdNzm1QA"; 
    const sb = window.supabase.createClient(sbUrl, sbKey);

    document.getElementById('date_trajet').valueAsDate = new Date();

    function showPage(p, btn) {
        document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        if(btn) btn.classList.add('active');
        if(p === 'hist') charger();
    }

    async function envoyerTrajet() {
        const { error } = await sb.from('trajets').insert([{
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            date_trajet: document.getElementById('date_trajet').value,
            destination: document.getElementById('dest').value,
            km_depart: parseInt(document.getElementById('km_dep').value),
            km_arrivee: parseInt(document.getElementById('km_arr').value),
            jauge_essence: parseInt(document.getElementById('jauge').value),
            voiture_propre: document.getElementById('propre').value
        }]);
        document.getElementById('msg').innerText = error ? "Erreur !" : "✅ Succès !";
    }

    async function charger() {
        const { data } = await sb.from('trajets').select('*').limit(8).order('created_at', { ascending: false });
        document.getElementById('liste').innerHTML = data.map(t => 
            `<div style="font-size:12px; margin:5px; padding:5px; border-bottom:1px solid #ccc;">${t.destination} - ${t.jauge_essence}/8</div>`
        ).join('');
    }
</script>
</body>
</html>
