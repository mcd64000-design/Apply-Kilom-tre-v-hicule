<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Kilométrique</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #message { margin-top: 15px; text-align: center; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚗 Nouveau Trajet</h2>
    <div>
        <input type="text" id="nom" placeholder="Nom">
        <input type="text" id="prenom" placeholder="Prénom">
        <input type="date" id="date_trajet">
        <input type="number" id="km_depart" placeholder="KM Départ">
        <input type="number" id="km_arrivee" placeholder="KM Arrivée">
        <input type="text" id="point_depart" placeholder="Point de départ">
        <input type="text" id="destination" placeholder="Destination">
        <button type="button" onclick="envoyerDonnees()">Enregistrer le trajet</button>
    </div>
    <div id="message"></div>
</div>

<script>
    const SUPABASE_URL = "https://pckketidnitktkmqscik.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja2tldGlkbml0a3RrbXFzY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTc2MzYsImV4cCI6MjA5OTEzNzYzNn0.bwkJDCeD6iZAQCACEYLS9-UK9CwK0LMcKRAQdNzm1QA";
    
    // Création unique du client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Date du jour automatique
    if (document.getElementById('date_trajet')) {
        document.getElementById('date_trajet').valueAsDate = new Date();
    }

    async function envoyerDonnees() {
        const msg = document.getElementById('message');
        
        const nom = document.getElementById('nom').value;
        const prenom = document.getElementById('prenom').value;
        const date_trajet = document.getElementById('date_trajet').value;
        const km_depart = document.getElementById('km_depart').value;
        const km_arrivee = document.getElementById('km_arrivee').value;
        const point_depart = document.getElementById('point_depart').value;
        const destination = document.getElementById('destination').value;

        if (!nom || !prenom || !date_trajet || !km_depart || !km_arrivee || !point_depart || !destination) {
            msg.style.color = "red";
            msg.innerText = "⚠️ Veuillez remplir tous les champs.";
            return;
        }

        msg.style.color = "orange";
        msg.innerText = "⏳ Envoi en cours...";

        const payload = {
            nom: nom,
            prenom: prenom,
            date_trajet: date_trajet,
            km_depart: parseInt(km_depart),
            km_arrivee: parseInt(km_arrivee),
            point_depart: point_depart,
            destination: destination
        };

        try {
            const { error } = await supabase.from('trajets').insert([payload]);

            if (error) {
                msg.style.color = "red";
                msg.innerText = "❌ Erreur Supabase : " + error.message;
            } else {
                msg.style.color = "green";
                msg.innerText = "✅ Trajet enregistré avec succès !";
                document.getElementById('km_depart').value = '';
                document.getElementById('km_arrivee').value = '';
            }
        } catch (err) {
            msg.style.color = "red";
            msg.innerText = "💥 Erreur système : " + err.message;
        }
    }
</script>
</body>
</html>
