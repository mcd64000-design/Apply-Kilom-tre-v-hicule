<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Kilométrique</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: #0070f3; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button.main { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <div class="tabs">
        <button class="tab-btn active" onclick="showPage('form', this)">Nouveau</button>
        <button class="tab-btn" onclick="showPage('hist', this)">Historique</button>
    </div>

    <div id="form" class="page active">
        <input type="text" id="nom" placeholder="Nom">
        <input type="text" id="prenom" placeholder="Prénom">
        <input type="date" id="date_trajet">
        <input type="text" id="pt_dep" placeholder="Point de départ">
        <input type="text" id="dest" placeholder="Destination">
        <input type="number" id="km_dep" placeholder="KM Départ">
        <input type="number" id="km_arr" placeholder="KM Arrivée">
        <label>Jauge essence (1-8):</label>
        <input type="range" id="jauge" min="1" max="8" value="4">
        <label>Voiture propre ?</label>
        <select id="propre"><option value="Oui">Oui</option><option value="Non">Non</option></select>
        <button class="main" onclick="envoyerTrajet()">Enregistrer</button>
        <p id="msg" style="text-align:center; font-weight:bold;"></p>
    </div>

    <div id="hist" class="page">
        <div id="liste">Chargement...</div>
    </div>
</div>

<script>
    let sb;
    const sbUrl = "https://pckketidnitktkmqscik.supabase.co"; 
    const sbKey = "VeyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBja2tldGlkbml0a3RrbXFzY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTc2MzYsImV4cCI6MjA5OTE3MzYzNn0.bwkJDCeD6iZAQCACEYLS9-UK9CwK0LMcKRAQdNzm1QA"; 
    sb = window.supabase.createClient(sbUrl, sbKey);

    document.getElementById('date_trajet').valueAsDate = new Date();

    function showPage(p, btn) {
        document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        if(btn) btn.classList.add('active');
        if(p === 'hist') charger();
    }

    async function envoyerTrajet() {
        const msg = document.getElementById('msg');
        msg.innerText = "Envoi...";
        
        const now = new Date();
        const heureActuelle = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        const dateComplete = document.getElementById('date_trajet').value + " " + heureActuelle;

        const dataInsert = {
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            date_trajet: dateComplete,
            point_depart: document.getElementById('pt_dep').value,
            destination: document.getElementById('dest').value,
            km_depart: parseInt(document.getElementById('km_dep').value),
            km_arrivee: parseInt(document.getElementById('km_arr').value),
            jauge_essence: parseInt(document.getElementById('jauge').value),
            voiture_propre: document.getElementById('propre').value
        };

        const { error } = await sb.from('trajets').insert([dataInsert]);
        
        if (error) {
            console.error("Erreur :", error);
            msg.innerText = "Erreur : " + error.message;
        } else {
            msg.innerText = "✅ Succès !";
            document.getElementById('nom').value = '';
            document.getElementById('prenom').value = '';
            document.getElementById('pt_dep').value = '';
            document.getElementById('dest').value = '';
            document.getElementById('km_dep').value = '';
            document.getElementById('km_arr').value = '';
            setTimeout(() => { msg.innerText = ""; }, 3000);
        }
    }

    async function charger() {
        const liste = document.getElementById('liste');
        liste.innerHTML = "Chargement...";
        
        const { data, error } = await sb.from('trajets').select('*').limit(8).order('id', { ascending: false });
        
        if (error) {
            liste.innerHTML = "Erreur de chargement.";
            return;
        }

        liste.innerHTML = (data || []).map(t => 
            `<div style="font-size:12px; padding:10px; border-bottom:1px solid #ccc; margin-bottom:5px; background: #fff;">
                <strong>${t.date_trajet}</strong><br>
                ${t.nom} ${t.prenom} | <strong>${t.destination}</strong><br>
                Départ : ${t.point_depart} ➔ Arrivée : ${t.km_arrivee} km<br>
                Essence : ${t.jauge_essence}/8 | Propre : ${t.voiture_propre}
            </div>`
        ).join('');
    }
</script>
</body>
</html>
