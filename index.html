<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Kilométrique</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; }
        .tab-btn.active { background: #0070f3; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .card { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; border: 1px solid #edf2f7; }
    </style>
</head>
<body>

<div class="box">
    <div class="tabs">
        <button class="tab-btn active" onclick="showPage('form')">Nouveau</button>
        <button class="tab-btn" onclick="showPage('hist')">Historique</button>
    </div>

    <!-- PAGE FORMULAIRE -->
    <div id="form" class="page active">
        <input type="text" id="dest" placeholder="Destination">
        <input type="number" id="km_dep" placeholder="KM Départ">
        <input type="number" id="km_arr" placeholder="KM Arrivée">
        <label>Jauge essence (1-8):</label>
        <input type="range" id="jauge" min="1" max="8" value="4">
        <label>Voiture propre ?</label>
        <select id="propre"><option>Oui</option><option>Non</option></select>
        <button onclick="enregistrer()">Enregistrer</button>
        <p id="msg"></p>
    </div>

    <!-- PAGE HISTORIQUE -->
    <div id="hist" class="page">
        <div id="liste">Chargement...</div>
    </div>
</div>

<script>
    // --- VOS IDENTIFIANTS ICI ---
    const url = "https://pckketidnitktkmqscik.supabase.co"; 
    const key = "VOTRE_CLE_PUB_ICI"; 
    const supabase = window.supabase.createClient(url, key);

    function showPage(p) {
        document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
        document.getElementById(p).classList.add('active');
        event.target.classList.add('active');
        if(p === 'hist') charger();
    }

    async function enregistrer() {
        const { error } = await supabase.from('trajets').insert([{
            destination: document.getElementById('dest').value,
            km_depart: document.getElementById('km_dep').value,
            km_arrivee: document.getElementById('km_arr').value,
            jauge_essence: document.getElementById('jauge').value,
            voiture_propre: document.getElementById('propre').value,
            date_trajet: new Date().toISOString()
        }]);
        document.getElementById('msg').innerText = error ? "Erreur !" : "Succès !";
    }

    async function charger() {
        const { data } = await supabase.from('trajets').select('*').limit(8).order('created_at', { ascending: false });
        document.getElementById('liste').innerHTML = data.map(t => 
            `<div class="card">${t.destination} - ${t.km_arrivee - t.km_depart}km (Ess: ${t.jauge_essence}/8)</div>`
        ).join('');
    }
</script>
</body>
</html>
